syntax = "proto3";

package tudou.rpc;

option cc_generic_services = true;

// 框架内部帧元数据定义
message RpcMeta {
    string service_name = 1;
    string method_name = 2;
}

// 示例通用请求消息
message EchoRequest {
    string message = 1;
}

// 示例通用响应消息
message EchoResponse {
    string message = 1;
}

// 示例二进制 RPC 服务声明
service EchoService {
    rpc Echo(EchoRequest) returns (EchoResponse);
}
